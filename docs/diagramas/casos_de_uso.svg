.78,309.43" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="61" x="461" y="256.5938">«include»</text><!--link UC4 to UCK--><path d="M384.39,271.82 C399.64,278.22 415.74,285.75 430,294 C444.54,302.42 444.09,311.6 460,317 C503.31,331.69 555.07,330.3 594.81,325.58 " fill="none" id="UC4-UCK" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#A80036" points="600.09,324.93,590.6664,322.0672,595.128,325.5449,591.6502,330.0064,600.09,324.93" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="61" x="461" y="313.5938">«include»</text><!--link UC5 to UCK--><path d="M378.41,476.59 C395.2,470 413.61,462.21 430,454 C500.81,418.53 578.43,368.21 622.39,338.55 " fill="none" id="UC5-UCK" style="stroke: #A80036; stroke-width: 1.0; stroke-dasharray: 7.0,7.0;"/><polygon fill="#A80036" points="626.53,335.74,616.8363,337.4811,622.3919,338.5465,621.3266,344.1021,626.53,335.74" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="61" x="461" y="401.5938">«include»</text><!--
@startuml casos_de_uso
left to right direction
skinparam shadowing false
skinparam usecase {
  BackgroundColor #EEF4FB
  BorderColor #2D6A8F
}
skinparam actor {
  BorderColor #1F2A44
}
actor "Auxiliar contable" as Aux
actor "Gerente" as Ger
actor "Vendedor" as Ven
actor "Proveedor tecnológico\n(sistema externo)" as PT <<sistema>>
rectangle "Plataforma de facturación e inventario — Distribuciones Andina" {
  usecase "UC1 Registrar factura\nelectrónica (XML UBL)" as UC1
  usecase "UC2 Registrar factura\npor API (JSON)" as UC2
  usecase "Validar y clasificar\nfactura (venta/compra)" as UCV
  usecase "Actualizar inventario" as UCI
  usecase "Generar alerta de\nstock bajo" as UCA
  usecase "UC3 Consultar facturas" as UC3
  usecase "UC4 Ver resumen de\nventas, compras e IVA" as UC4
  usecase "UC5 Consultar stock\ny kardex" as UC5
  usecase "UC6 Consultar alertas" as UC6
  usecase "Autenticar con\nAPI key" as UCK
}
Aux - -> UC1
Aux - -> UC3
PT - -> UC2
Ger - -> UC4
Ger - -> UC6
Ven - -> UC5
UC1 ..> UCV : <<include>>
UC2 ..> UCV : <<include>>
UCV ..> UCI : <<include>>
UCA .> UCI : <<extend>>
UC1 ..> UCK : <<include>>
UC2 ..> UCK : <<include>>
UC3 ..> UCK : <<include>>
UC4 ..> UCK : <<include>>
UC5 ..> UCK : <<include>>
@enduml

