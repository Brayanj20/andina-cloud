tyle="stroke: #000000; stroke-width: 2.0;" width="355.5" x="995.5" y="656.3799"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="21" x="1010.5" y="669.9736">opt</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacingAndGlyphs" textLength="90" x="1076.5" y="669.0361">[stock &lt; mínimo]</text><polygon fill="#A80036" points="1081.5,691.8389,1071.5,695.8389,1081.5,699.8389,1077.5,695.8389" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="1075.5" x2="1300.5" y1="695.8389" y2="695.8389"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="101" x="1087.5" y="690.7031">XADD StockBajo</text><polygon fill="#A80036" points="1081.5,728.5684,1071.5,732.5684,1081.5,736.5684,1077.5,732.5684" style="stroke: #A80036; stroke-width: 1.0;"/><line style="stroke: #A80036; stroke-width: 1.0;" x1="1075.5" x2="1300.5" y1="732.5684" y2="732.5684"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacingAndGlyphs" textLength="37" x="1087.5" y="727.4326">XACK</text><!--
@startuml secuencia
skinparam shadowing false
skinparam sequence {
  ParticipantBorderColor #2D6A8F
  ParticipantBackgroundColor #EEF4FB
  LifeLineBorderColor #8A8A8A
}
actor "Auxiliar contable" as U
participant "API Gateway" as G
participant "Facturación" as F
database "BD Facturación" as DF
queue "Redis Streams\n(andina.eventos)" as B
participant "Inventario" as I
database "BD Inventario" as DI
U -> G : POST /api/facturacion/facturas (XML, X-API-Key)
G -> G : validar API key
G -> F : POST /facturas [reintento + circuit breaker]
F -> F : ParserFactory.para("xml").parse()\nvalidar() · clasificar(NIT)
F -> DF : INSERT factura (único nit+número)
alt factura duplicada
  F - -> G : 409 Conflict
  G - -> U : 409 Conflict
else registrada
  F -> B : XADD FacturaRegistrada
  F - -> G : 201 Created (factura)
  G - -> U : 201 Created
end
note over B, I : Asíncrono: si Inventario está caído,\nel evento espera en el stream
I -> B : XREADGROUP grupo "inventario"
B - -> I : FacturaRegistrada
I -> DI : ¿evento ya procesado? (idempotencia)
I -> DI : actualizar stock + kardex (transacción)
opt stock < mínimo
  I -> B : XADD StockBajo
end
I -> B : XACK
@enduml

